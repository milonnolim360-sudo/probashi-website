<html lang="bn">
<head>
    <meta charset="UTF-8">

    <title>বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন | ডিজিটাল পোর্টাল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* --- Golden & Luxury Theme CSS --- */
        :root {
            --gold: linear-gradient(135deg, #ffd700, #b8860b);
            --gold-border: #ffd700;
            --bg-dark: #000000;
            --card-bg: rgba(20, 20, 20, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: white; padding-bottom: 50px; overflow-x: hidden; }

        /* Banner */
        .header-banner { width: 100%; border-bottom: 3px solid #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        .header-banner img { width: 100%; display: block; }

        .container { padding: 15px; max-width: 800px; margin: auto; }

        /* Section Titles */
        .title-gold {
            text-align: center; color: #ffd700; font-size: 18px; font-weight: bold;
            margin: 20px 0; text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .title-gold::before, .title-gold::after { content: ""; width: 50px; height: 2px; background: var(--gold); }

        /* Features Grid */
        .features-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .feature-card {
            background: var(--card-bg); border: 1.5px solid var(--gold-border);
            border-radius: 12px; padding: 12px 5px; text-align: center;
            text-decoration: none; color: white; transition: 0.3s;
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.1);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .feature-card:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .feature-card i { font-size: 28px; background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .feature-card h4 { font-size: 10px; font-weight: 600; }
        .feature-card p { font-size: 8px; color: #ccc; }

        /* Video Gallery */
        .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .video-item { 
            background: #111; border-radius: 10px; border: 1px solid var(--gold-border);
            overflow: hidden; position: relative;
        }
        .video-item iframe { width: 100%; height: 100px; }
        .video-item p { font-size: 9px; padding: 5px; text-align: center; background: rgba(0,0,0,0.7); }

        /* WhatsApp Section */
        .wa-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .wa-btn {
            background: linear-gradient(135deg, #00a859, #004d2c);
            border: 1px solid #ffd700; border-radius: 30px; padding: 10px;
            text-align: center; text-decoration: none; color: white; font-size: 10px;
            font-weight: bold; display: flex; flex-direction: column; align-items: center;
        }

        /* Footer */
        .footer { text-align: center; margin-top: 30px; padding: 20px; border-top: 1px solid #333; }
        .footer p { font-size: 12px; color: #ffd700; font-weight: bold; }

        /* Admin UI */
        .admin-icon { position: fixed; bottom: 20px; right: 20px; background: #ffd700; color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; z-index: 1000; }
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; padding: 20px; overflow-y: auto; }
