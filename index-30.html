<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন</title><style>body{margin:0;font-family:Arial;background:#0b1f3a;color:#fff}header{background:#0d47a1;padding:18px;text-align:center}.wrap{max-width:900px;margin:auto;padding:15px}.card{background:#ffffff14;border-radius:14px;padding:15px;margin:14px 0}input{width:100%;padding:12px;margin:7px 0;border:none;border-radius:8px}button{width:100%;padding:12px;border:none;border-radius:8px;background:#00c853;color:#fff;font-weight:bold}a{color:#90caf9}.hidden{display:none}</style></head><body><header><h2>🇧🇩 বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন</h2><p>ঐক্য • সেবা • কল্যাণ</p></header><div class="wrap"><div id="reg" class="card"><h3>সদস্য রেজিস্ট্রেশন</h3><input id="n" placeholder="পূর্ণ নাম"><input id="m" placeholder="মোবাইল"><input id="d" placeholder="জেলা"><input id="p" type="password" placeholder="পাসওয়ার্ড"><button onclick="reg()">রেজিস্ট্রেশন</button><p><a href="#" onclick="showLog()">লগইন</a></p></div><div id="log" class="card hidden"><h3>লগইন</h3><input id="lm" placeholder="মোবাইল"><input id="lp" type="password" placeholder="পাসওয়ার্ড"><button onclick="login()">লগইন</button></div><div id="home" class="hidden"><div class="card"><h3 id="w"></h3><button onclick="logout()">Logout</button></div><div class="card"><p><a target="_blank" href="https://www.facebook.com/share/1DPBjB3ePJ/">Facebook</a></p><p><a target="_blank" href="https://www.youtube.com/@Bangladeshprobashifundclubf">YouTube</a></p><p><a target="_blank" href="https://chat.whatsapp.com/D09urUItfkdEjiVtqgIbY7">WhatsApp</a></p></div></div></div><script>function showLog(){reg.classList.add('hidden');log.classList.remove('hidden')}function reg(){localStorage.setItem('u',JSON.stringify({n:n.value,m:m.value,d:d.value,p:p.value}));alert('সফল');showLog()}function login(){let u=JSON.parse(localStorage.getItem('u')||'null');if(!u)return alert('রেজিস্ট্রেশন করুন');if(lm.value==u.m&&lp.value==u.p){log.classList.add('hidden');home.classList.remove('hidden');w.innerText='স্বাগতম '+u.n}else alert('ভুল তথ্য')}function logout(){home.classList.add('hidden');reg.classList.remove('hidden')}</script></body></html>
