<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
font-family:Arial,"Noto Sans Bengali","Noto Sans Bangla",sans-serif;
background:
radial-gradient(circle at 50% -10%,#193d5d,transparent 35%),
radial-gradient(circle at 0% 50%,#063d34,transparent 30%),
#040914;
color:#fff;
min-height:100vh;
padding-bottom:90px;
}

a{text-decoration:none;color:inherit}

.container{
width:min(1120px,94%);
margin:auto;
}

/* HEADER */

.header{
position:sticky;
top:0;
z-index:1000;
text-align:center;
padding:18px 12px;
background:rgba(4,9,20,.92);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(212,175,55,.4);
}

.logo{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:3px solid #d4af37;
box-shadow:
0 0 0 3px #087f65,
0 0 30px rgba(212,175,55,.5);
}

.title{
margin-top:10px;
font-size:clamp(22px,5vw,32px);
font-weight:900;
color:#ffd700;
text-shadow:0 0 18px rgba(255,215,0,.25);
}

.subtitle{
margin-top:6px;
font-size:13px;
color:#aeb9c9;
}

.nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:7px;
margin-top:15px;
}

.nav a{
padding:9px 13px;
border-radius:20px;
font-size:11px;
font-weight:bold;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.12);
color:#dbe4ef;
}

.nav a:hover{
border-color:#ffd700;
color:#ffd700;
}

/* HERO */

.hero{
text-align:center;
padding:40px 10px 25px;
}

.hero h2{
font-size:28px;
color:#ffd700;
}

.hero p{
margin-top:10px;
color:#aeb9c9;
font-size:14px;
line-height:1.7;
}

/* SECTION */

.section-title{
text-align:center;
font-size:24px;
color:#ffd700;
margin:25px 0 20px;
}

/* FEATURES */

.feature-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
}

.feature-card{
min-height:185px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:18px 10px;
border-radius:24px;
background:
linear-gradient(145deg,rgba(28,45,63,.9),rgba(6,13,24,.96));
border:1px solid rgba(255,255,255,.1);
box-shadow:
0 15px 35px rgba(0,0,0,.5),
inset 0 1px rgba(255,255,255,.1);
transition:.3s;
}

.feature-card:hover{
transform:translateY(-7px) scale(1.02);
border-color:#d4af37;
box-shadow:
0 20px 45px rgba(0,0,0,.65),
0 0 25px rgba(212,175,55,.15);
}

.feature-icon{
width:76px;
height:76px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;

background:
radial-gradient(circle at 30% 25%,
#ffffff,
#72e7ce 12%,
#159b7f 40%,
#075545 70%,
#031c18);

border:2px solid rgba(255,255,255,.35);

box-shadow:
7px 9px 18px rgba(0,0,0,.55),
inset 4px 4px 9px rgba(255,255,255,.5),
inset -6px -6px 10px rgba(0,0,0,.55);
}

.feature-card:nth-child(3n) .feature-icon{
background:
radial-gradient(circle at 30% 25%,
#fff,
#ffe875 12%,
#d4af37 45%,
#765700 75%,
#261d00);
}

.feature-card:nth-child(4n) .feature-icon{
background:
radial-gradient(circle at 30% 25%,
#fff,
#9ab5ff 12%,
#4163c5 45%,
#101d50 75%,
#050a20);
}

.feature-card h3{
margin-top:14px;
font-size:16px;
color:#f6df77;
}

.feature-card p{
margin-top:5px;
font-size:11px;
color:#aab6c6;
}

/* VIDEO */

.youtube{
margin-top:42px;
}

.channel-box{
display:flex;
align-items:center;
gap:14px;
padding:17px;
border-radius:20px;
margin-bottom:18px;
background:linear-gradient(145deg,#14283b,#07101c);
border:1px solid rgba(255,215,0,.3);
}

.youtube-icon{
width:58px;
height:58px;
min-width:58px;
border-radius:17px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
background:linear-gradient(145deg,#ff7777,#d90000,#650000);
box-shadow:
inset 3px 3px 6px rgba(255,255,255,.3),
inset -5px -5px 8px rgba(0,0,0,.5),
0 8px 15px rgba(0,0,0,.5);
}

.channel-box h3{
color:#ffd700;
font-size:16px;
}

.channel-box p{
margin-top:4px;
font-size:11px;
color:#9eabbc;
}

.video-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:17px;
}

.video-card{
overflow:hidden;
border-radius:20px;
background:#07101a;
border:1px solid rgba(255,215,0,.25);
box-shadow:0 12px 30px rgba(0,0,0,.65);
}

.video-card iframe{
width:100%;
aspect-ratio:16/9;
display:block;
border:0;
}

.video-card.short iframe{
aspect-ratio:9/16;
}

.video-title{
padding:13px;
font-size:13px;
color:#ffd700;
}

/* PAYMENT */

.payment{
margin-top:42px;
}

.payment-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:17px;
}

.payment-card{
padding:23px;
text-align:center;
border-radius:22px;
background:linear-gradient(145deg,#142a27,#071019);
border:1px solid rgba(212,175,55,.35);
box-shadow:0 14px 30px rgba(0,0,0,.5);
}

.payment-icon{
font-size:48px;
margin-bottom:8px;
}

.payment-card h3{
color:#ffd700;
}

.payment-card p{
margin-top:5px;
color:#9eabbc;
font-size:12px;
}

/* CONTACT */

.contact{
margin-top:40px;
padding:28px 18px;
text-align:center;
border-radius:24px;
background:linear-gradient(145deg,#103c35,#07111d);
border:1px solid rgba(20,210,170,.25);
}

.contact p{
color:#b5c0ce;
line-height:1.8;
}

/* FOOTER */

footer{
margin-top:35px;
padding:28px 10px;
text-align:center;
border-top:1px solid rgba(212,175,55,.18);
color:#778294;
font-size:12px;
}

footer strong{
color:#ffd700;
}

/* BOTTOM */

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
height:76px;
z-index:5000;
display:flex;
align-items:center;
justify-content:space-around;
background:rgba(3,8,15,.97);
backdrop-filter:blur(18px);
border-top:1px solid #d4af37;
box-shadow:0 -10px 30px rgba(0,0,0,.6);
}

.bottom-item{
flex:1;
max-width:90px;
text-align:center;
font-size:9px;
font-weight:bold;
color:#8490a0;
}

.bottom-icon{
width:38px;
height:38px;
margin:auto auto 4px;
border-radius:13px;
display:flex;
align-items:center;
justify-content:center;
font-size:19px;
background:linear-gradient(145deg,#1c2c3d,#050a12);
}

.bottom-item:hover{
color:#ffd700;
}

.bottom-logo{
width:48px;
height:48px;
border-radius:50%;
object-fit:cover;
border:3px solid #d4af37;
box-shadow:
0 0 0 3px #087f65,
0 0 20px rgba(212,175,55,.4);
}

/* ADMIN */

.admin-overlay{
display:none;
position:fixed;
inset:0;
z-index:99999;
overflow:auto;
padding:20px;
background:rgba(0,0,0,.88);
backdrop-filter:blur(8px);
}

.admin-box{
width:min(750px,100%);
margin:35px auto;
padding:22px;
border-radius:24px;
background:
