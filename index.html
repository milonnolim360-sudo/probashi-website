<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* --- প্রিমিয়াম ডার্ক ডিজাইন --- */
        :root {
            --primary: #00a859;
            --accent: #ffd700;
            --bg: #030712;
            --card: #111827;
            --border: #1f2937;
            --text-gray: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: white; padding-bottom: 30px; overflow-x: hidden; }

        /* ব্যানার সেকশন */
        .banner { width: 100%; border-bottom: 4px solid var(--primary); box-shadow: 0 4px 20px rgba(0, 168, 89, 0.4); }
        .banner img { width: 100%; height: auto; display: block; }

        .container { padding: 15px; max-width: 600px; margin: auto; }

        /* পরিসংখ্যান কার্ড */
        .stats-container {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 20px; margin-top: -30px; position: relative; z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .stat-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1f2937; }
        .stat-item:last-child { border-bottom: none; }
        .stat-label { color: var(--text-gray); font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .stat-value { color: var(--accent); font-weight: bold; font-size: 18px; }

        /* শিরোনাম */
        .section-title { 
            font-size: 15px; font-weight: bold; color: var(--accent);
            margin: 25px 0 15px; border-left: 5px solid var(--primary);
            padding-left: 12px; display: flex; align-items: center; gap: 10px;
        }

        /* গ্রিড আইকন ডিজাইন */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .grid-item {
            background: var(--card); border: 1px solid var(--border); border-radius: 18px;
            padding: 15px 5px; text-align: center; text-decoration: none; color: white;
            transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .grid-item:active { transform: scale(0.9); background: #1f2937; }
        .grid-item i { font-size: 26px; }
        .grid-item span { font-size: 9px; font-weight: bold; }

        /* আইকন কালার */
        .c-fb { color: #1877f2; } .c-yt { color: #ff0000; } .c-wa { color: #25d366; } 
        .c-tk { color: #ffffff; } .c-msg { color: #0084ff; } .c-sky { color: #0ea5e9; }
        .c-qr { color: #facc15; } .c-rose { color: #f43f5e; }

        /* অ্যাডমিন বাটন ও প্যানেল */
        .admin-trigger { 
            position: fixed; bottom: 25px; right: 25px; background: var(--accent); 
            color: #000; width: 55px; height: 55px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.6); z-index: 1000; 
        }
        
        #admin-panel { 
            display: none; background: #0f172a; border-radius: 25px 25px 0 0; 
            padding: 25px; position: fixed; bottom: 0; left: 0; width: 100%; 
            border-top: 5px solid var(--primary); box-shadow: 0 -10px 40px rgba(0,0,0,0.9); z-index: 1001;
        }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-update { background: var(--primary); color: white; }
        .btn-close { background: #374151; color: white; }

        /* কন্টাক্ট কার্ড */
        .contact-card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 15px; }
        .contact-card p { font-size: 13px; margin: 8px 0; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <!-- ১. টপ ব্যানার -->

    <div class="container">

            </div>
        </div>

        <!-- ৩. অনলাইন প্ল্যাটফর্ম লিংক -->
        <div class="section-title"><i class="fas fa-share-nodes"></i> অনলাইন প্ল্যাটফর্ম</div>
        <div class="grid">

            <a href="https://www.facebook.com/share/g/192DRWMbcQ/" class="grid-item"><i class="fas fa-users c-fb"></i><span>Group</span></a>
            <a href="https://www.youtube.com/@Bangladeshprobashifundclubf" class="grid-item"><i class="fab fa-youtube c-yt"></i><span>YouTube</span></a>
            <a href="https://tiktok.com/@md.rafik7854" class="grid-item"><i class="fab fa-tiktok c-tk"></i><span>TikTok</span></a>
            <a href="https://m.me/j/AbazuYGAWNXaKYj3/" class="grid-item"><i class="fab fa-facebook-messenger c-msg"></i><span>Messenger</span></a>
            <a href="https://chat.whatsapp.com/D09urUItfkdEjiVtqgIbY7" class="grid-item"><i class="fab fa-whatsapp c-wa"></i><span>WhatsApp</span></a>
            <a href="https://freeder.com.bd/pages/banglades-prbasee-mnc-faundesn" class="grid-item"><i class="fas fa-shopping-bag c-sky"></i><span>Freeder</span></a>
            <a href="https://hopenity.com/page/voice.probashi.001" class="grid-item"><i class="fas fa-heart c-rose"></i><span>Hopenity</span></a>
        </div>

        <!-- ৪. ফিউচার সার্ভিস আইকন (আপনার রিকোয়েস্ট অনুযায়ী) -->
        <div class="section-title"><i class="fas fa-star"></i> বিশেষ সেবা ও ফিউচার</div>
        <div class="grid">
            <a href="https://share.google/jon5xwTlWY0J97cOV" class="grid-item"><i class="fas fa-file-contract c-qr"></i><span>ESKL</span></a>
            <a href="https://share.google/yvTohMtiDEbxh3D7j" class="grid-item"><i class="fas fa-passport c-wa"></i><span>পাসপোর্ট চেক</span></a>
            <div class="grid-item" onclick="alert('TNG Digital QR শীঘ্রই আসছে...')"><i class="fas fa-qrcode c-qr"></i><span>TNG Digital</span></div>
            <div class="grid-item" onclick="alert('BAKS: +8801961704927')"><i class="fas fa-university c-tk"></i><span>BAKS</span></div>
        </div>

        <!-- ৫. যোগাযোগ -->
        <div class="section-title"><i class="fas fa-headset"></i> সরাসরি যোগাযোগ</div>
        <div class="contact-card">
            <p><i class="fab fa-whatsapp c-wa"></i> +880 1928-807515</p>
            <p><i class="fab fa-whatsapp c-wa"></i> +60 11-6767 2535</p>
            <p><i class="fas fa-phone-alt c-qr"></i> +880 1961-704927 (BAKS)</p>
        </div>
    </div>

    <!-- অ্যাডমিন লগইন আইকন -->
    <div class="admin-trigger" onclick="login()"><i class="fas fa-user-shield"></i></div>

    <!-- অ্যাডমিন প্যানেল -->
    <div id="admin-panel">
        <h2 style="color: var(--accent); text-align: center; margin-bottom: 20px;">অ্যাডমিন কন্ট্রোল</h2>
        
        <label>মোট সদস্য সংখ্যা আপডেট করুন:</label>
        <input type="number" id="inp-total" placeholder="সদস্য সংখ্যা">
        
        <label>অনলাইন সদস্য সংখ্যা আপডেট করুন:</label>
        <input type="number" id="inp-online" placeholder="অনলাইন সংখ্যা">
        
        <button class="btn btn-update" onclick="saveData()">ডাটাবেস আপডেট করুন</button>
        <button class="btn btn-close" onclick="logout()">লগআউট</button>
    </div>

    <!-- JavaScript লজিক -->
    <script>
        function login() {
            const user = prompt("ইউজারনেম (Username) দিন:");
            const pass = prompt("পাসওয়ার্ড (Password) দিন:");
            
            if(user === "MDRAFIK1987" && pass === "MDRAFIK@1987") {
                alert("স্বাগতম রাফিক ভাই!");
                document.getElementById('admin-panel').style.display = 'block';
                window.scrollTo(0, document.body.scrollHeight);
            } else {
                alert("ভুল ইউজারনেম বা পাসওয়ার্ড!");
            }
        }

        function saveData() {
            const t = document.getElementById('inp-total').value;
            const o = document.getElementById('inp-online').value;
            
            if(t) document.getElementById('total-val').innerText = t;
            if(o) document.getElementById('online-val').innerText = o;
            
            alert("তথ্য সফলভাবে আপডেট হয়েছে!");
            document.getElementById('admin-panel').style.display = 'none';
        }

        function logout() { location.reload(); }
    </script>

</body>
</html>
