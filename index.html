<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন | ডিজিটাল পোর্টাল</title>
    
    <!-- External Libraries (প্রোফেশনাল লুকের জন্য) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        /* --- প্রফেশনাল থিম ও ভেরিয়েবল --- */
        :root {
            --primary: #00a859;
            --primary-dark: #007d42;
            --accent: #ffd700;
            --bg-deep: #020617;
            --bg-card: #0f172a;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-clr: rgba(255, 255, 255, 0.1);
            --neon-shadow: 0 0 15px rgba(0, 168, 89, 0.4);
        }

        /* --- গ্লোবাল স্টাইল --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Segoe UI', 'SolaimanLipi', Arial, sans-serif; 
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, rgba(0, 168, 89, 0.1), transparent);
        }

        /* --- লোডিং অ্যানিমেশন --- */
        #loader {
            position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-deep);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid var(--border-clr); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- হেডার ও ব্যানার --- */
        header { width: 100%; position: relative; border-bottom: 4px solid var(--primary); overflow: hidden; }
        .banner-img { width: 100%; display: block; filter: brightness(0.9); transition: 0.5s; }
        .banner-img:hover { filter: brightness(1.1); transform: scale(1.02); }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; position: relative; }

        /* --- স্ট্যাটাস কার্ড (ডিজিটাল লুক) --- */
        .stats-wrapper {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-clr);
            border-radius: 25px;
            padding: 25px;
            margin-top: -50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            animation: slideUp 1s ease;
        }
        .stat-box { text-align: center; border-right: 1px solid var(--border-clr); }
        .stat-box:last-child { border-right: none; }
        .stat-box h3 { font-size: 24px; color: var(--accent); text-shadow: var(--neon-shadow); }
        .stat-box p { font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-top: 5px; }

        /* --- টাইটেল স্টাইল --- */
        .section-header { 
            margin: 35px 0 20px; display: flex; align-items: center; gap: 15px; 
            font-size: 16px; font-weight: bold; color: var(--primary);
        }
        .section-header::after { content: ""; flex: 1; height: 1px; background: var(--border-clr); }

        /* --- প্রিমিয়াম গ্রিড আইকন --- */
        .portal-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; 
        }
        .portal-item {
            background: var(--bg-card);
            border: 1px solid var(--border-clr);
            border-radius: 20px;
            padding: 18px 5px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .portal-item:hover { 
            border-color: var(--primary); transform: translateY(-10px); 
            background: linear-gradient(145deg, #1e293b, #0f172a);
            box-shadow: 0 10px 20px rgba(0, 168, 89, 0.2);
        }
        .portal-item i { font-size: 28px; }
        .portal-item span { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }

        /* আইকন কালারস */
        .c-fb { color: #1877f2; } .c-yt { color: #ff0000; } .c-wa { color: #25d366; } 
        .c-tk { color: #ffffff; } .c-msg { color: #0084ff; } .c-eskl { color: #3b82f6; }
        .c-passport { color: #4ade80; } .c-tng { color: #ffd700; }

        /* --- ভিডিও গ্যালারি --- */
        .video-scroller { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; }
        .video-card { 
            min-width: 250px; background: var(--bg-card); border-radius: 15px; overflow: hidden; border: 1px solid var(--border-clr); 
            scroll-snap-align: start;
        }
        .video-card img { width: 100%; height: 140px; object-fit: cover; }
        .video-card h4 { padding: 10px; font-size: 12px; font-weight: 500; }

        /* --- কন্টাক্ট ইনফো --- */
        .footer-card {
            background: var(--bg-card); padding: 20px; border-radius: 20px; margin-top: 30px;
            border-top: 3px solid var(--primary);
        }
        .footer-card p { font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; color: var(--text-dim); }
        .footer-card p i { color: var(--primary); font-size: 18px; }

        /* --- সিকিউর অ্যাডমিন প্যানেল --- */
        .admin-trigger {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--primary); color: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 168, 89, 0.5);
            transition: 0.3s;
        }
        .admin-trigger:hover { transform: rotate(90deg) scale(1.1); }

        #admin-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; backdrop-filter: blur(10px);
            align-items: center; justify-content: center;
        }
        .login-form {
            background: var(--bg-card); padding: 40px; border-radius: 30px; width: 90%; max-width: 400px;
            border: 1px solid var(--primary); text-align: center;
        }
        .login-form input {
            width: 100%; padding: 15px; margin: 15px 0; border-radius: 12px; border: 1px solid var(--border-clr);
            background: var(--bg-deep); color: white; font-size: 16px;
        }
        .btn-main {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: var(--primary); color: white; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        .btn-main:hover { background: var(--primary-dark); box-shadow: var(--neon-shadow); }

        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* মোবাইল অপ্টিমাইজেশন */
        @media (max-width: 480px) {
            .portal-grid { grid-template-columns: repeat(3, 1fr); }
            .stat-box h3 { font-size: 20px; }
        }
    </style>
</head>
