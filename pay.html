<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #f3f5f2;
      color: #222;
      padding: 20px;
    }

    .payment {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 20px;
      padding: 25px 18px 35px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.12);
    }

    h1 {
      margin: 5px 0 25px;
      font-size: 25px;
    }

    .qr {
      width: 100%;
      max-width: 500px;
      margin: auto;
      border-radius: 18px;
      display: block;
    }

    .text {
      margin-top: 20px;
      font-size: 16px;
      color: #666;
      line-height: 1.6;
    }

    .bkash {
      margin-top: 30px;
      padding: 20px;
      border-radius: 16px;
      background: #f5f5f5;
    }

    
    }
  </style>
</head>

<body>

  <div class="payment">

    <h1>পেমেন্ট করুন</h1>

    <img
      src="tng-qr.jpg"
      alt="Touch 'n Go eWallet QR"
      class="qr"
    >

    <div class="text">
      যেকোনো ব্যাংকিং অ্যাপ অথবা eWallet দিয়ে
      QR স্ক্যান করে পেমেন্ট করুন।
    </div>

    <div class="bkash">8801961704927
      <h2>বিকাশ</h2>
      <p>বিকাশের তথ্য পরে এখানে যুক্ত করা হবে।</p>
    </div>

  </div>

</body>
</html>
