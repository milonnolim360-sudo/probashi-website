<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00a859; --accent: #ffd700; --bg: #0b1120; --card: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial; }
        body { background-color: var(--bg); color: white; padding-bottom: 50px; }

        /* Banner */
        .banner img { width: 100%; display: block; border-bottom: 3px solid var(--primary); }

        .container { padding: 15px; }

        /* Stats Card */
        .stats-box { 
            background: linear-gradient(145deg, #1e293b, #0f172a); 
            padding: 15px; border-radius: 15px; margin: 10px 0; border: 1px solid #334155;
        }
        .stat-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 14px; }

        /* Grid Icons */
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .icon-card { 
            background: var(--card); padding: 12px 5px; border-radius: 12px; text-align: center; 
            border: 1px solid #334155; text-decoration: none; color: white; transition: 0.2s;
        }
        .icon-card i { font-size: 22px; margin-bottom: 5px; display: block; }
        .icon-card span { font-size: 9px; font-weight: bold; }
        .icon-card:active { transform: scale(0.9); }

        /* Admin Section */
        #admin-panel { display: none; background: #111827; padding: 20px; border-top: 2px solid var(--accent); margin-top: 30px; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #1f2937; color: white; border: 1px solid #374151; border-radius: 8px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-update { background: var(--primary); color: white; margin-top: 10px; }
        
        .login-btn { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: black; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- ব্যানার -->
    <div class="banner">
        <img src="https://i.ibb.co/XrnZzQk/Banner.jpg" alt="Banner">
    </div>

    <div class="container">
        <!-- সার্বিক পরিসংখ্যান (Real-time from Firebase) -->
        <div class="stats-box">
            <h4 style="color: var(--accent); margin-bottom: 10px; border-left: 4px solid var(--primary); padding-left: 10px;">সার্বিক পরিসংখ্যান</h4>
            <div class="stat-line"><span>মোট সদস্য:</span> <b id="total-val">লোড হচ্ছে...</b></div>
            <div class="stat-line"><span>অনলাইন সদস্য:</span> <b id="online-val" style="color:#4ade80;">লোড হচ্ছে...</b></div>
        </div>

        <h5 style="margin: 15px 0 10px; font-size: 14px; color: #94a3b8;">অনলাইন প্ল্যাটফর্ম</h5>
        <div class="grid-container">
            <a href="https://www.facebook.com/share/19Q6T6t2Zm/" class="icon-card"><i class="fab fa-facebook" style="color:#1877f2;"></i><span>Page</span></a>
            <a href="https://www.youtube.com/@Bangladeshprobashifundclubf" class="icon-card"><i class="fab fa-youtube" style="color:#ff0000;"></i><span>YouTube</span></a>
            <a href="https://tiktok.com/@md.rafik7854" class="icon-card"><i class="fab fa-tiktok"></i><span>TikTok</span></a>
            <a href="https://chat.whatsapp.com/D09urUItfkdEjiVtqgIbY7" class="icon-card"><i class="fab fa-whatsapp" style="color:#25d366;"></i><span>WhatsApp</span></a>
        </div>

        <!-- এডমিন লগইন বাটন -->
        <div class="login-btn" onclick="adminLogin()"><i class="fas fa-user-shield"></i></div>

        <!-- এডমিন প্যানেল (Hidden) -->
        <div id="admin-panel">
            <h3 style="color: var(--accent); text-align: center;">এডমিন কন্ট্রোল</h3>
            <p style="font-size: 12px; text-align: center; color: #94a3b8;">এখান থেকে ডাটা আপডেট করলে সবার অ্যাপে পরিবর্তন হবে</p>
            <hr style="margin: 15px 0; border-color: #374151;">
            
            <label>মোট সদস্য সংখ্যা আপডেট:</label>
            <input type="number" id="inp-total" placeholder="উদাহরণ: 12568">
            
            <label>অনলাইন সদস্য সংখ্যা আপডেট:</label>
            <input type="number" id="inp-online" placeholder="উদাহরণ: 1256">
            
            <button class="btn btn-update" onclick="updateFirebaseData()">ডাটাবেস আপডেট করুন</button>
            <button class="btn" style="background:#4b5563; color:white; margin-top:5px;" onclick="location.reload()">লগআউট</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>

    <script>
        // ১. আপনার Firebase Config এখানে বসান
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:12345:web:abcde"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ২. ডাটাবেস থেকে রিয়েল-টাইম ডাটা পড়া
        db.collection("portal_data").doc("stats").onSnapshot((doc) => {
            if (doc.exists) {
                document.getElementById('total-val').innerText = doc.data().total;
                document.getElementById('online-val').innerText = doc.data().online;
            } else {
                // প্রথমবার ডাটাবেস খালি থাকলে ডিফল্ট ডাটা সেট করা
                db.collection("portal_data").doc("stats").set({ total: "12,568", online: "1,256" });
            }
        });

        // ৩. এডমিন লগইন ফাংশন
        function adminLogin() {
            const user = prompt("ইউজারনেম দিন:");
            const pass = prompt("পাসওয়ার্ড দিন:");

            if(user === "MDRAFIK1987" && pass === "MDRAFIK@1987") {
                alert("স্বাগতম এডমিন!");
                document.getElementById('admin-panel').style.display = 'block';
                window.scrollTo(0, document.body.scrollHeight);
            } else {
                alert("ভুল ইউজারনেম বা পাসওয়ার্ড!");
            }
        }

        // ৪. ডাটাবেসে নতুন তথ্য সেভ করা
        function updateFirebaseData() {
            const newTotal = document.getElementById('inp-total').value;
            const newOnline = document.getElementById('inp-online').value;

            if(!newTotal || !newOnline) {
                alert("অনুগ্রহ করে দুটি ঘরই পূরণ করুন!");
                return;
            }

            db.collection("portal_data").doc("stats").update({
                total: newTotal,
                online: newOnline
            }).then(() => {
                alert("ডাটাবেস সফলভাবে আপডেট হয়েছে!");
                document.getElementById('inp-total').value = "";
                document.getElementById('inp-online').value = "";
            }).catch((error) => {
                alert("এরর: " + error.message);
            });
        }
    </script>
</body>
</html>
