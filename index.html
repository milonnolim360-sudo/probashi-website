<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJKSS ডিজিটাল ড্যাশবোর্ড</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #3b82f6; --bg: #0b1120; --card: #1e293b; --accent: #f97316; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial; }
        body { background-color: var(--bg); color: white; }

        /* Header */
        .header {
            background: linear-gradient(90deg, #1e293b, #0f172a);
            padding: 15px; border-bottom: 2px solid var(--primary);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        /* Profile Card */
        .profile-card {
            background: linear-gradient(145deg, #2563eb, #1e40af);
            margin: 15px; padding: 15px; border-radius: 15px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .profile-card img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #fff; background: #eee; }
        .profile-card h2 { font-size: 16px; margin-bottom: 5px; }
        .profile-card p { font-size: 11px; opacity: 0.9; }

        .container { padding: 15px; }
        .section-title { font-size: 14px; margin: 20px 0 12px 0; border-left: 4px solid var(--accent); padding-left: 10px; }

        /* Grid Buttons */
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .icon-card { background: var(--card); padding: 12px 5px; border-radius: 12px; text-align: center; border: 1px solid #334155; transition: 0.3s; cursor: pointer; }
        .icon-card i { font-size: 20px; margin-bottom: 5px; display: block; }
        .icon-card span { font-size: 9px; font-weight: bold; }
        .icon-card:active { transform: scale(0.9); }

        /* Video Section */
        .video-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .video-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #334155; }
        .video-thumb { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; }
        .video-card p { padding: 8px; font-size: 10px; color: #cbd5e1; }

        /* Stats Card */
        .stats-box { background: var(--card); padding: 15px; border-radius: 15px; margin-top: 15px; }
        .stat-line { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; border-bottom: 1px solid #334155; }

        /* Admin Control (Hidden Initially) */
        #admin-panel { 
            display: none; background: #0f172a; border: 2px dashed var(--primary); 
            margin: 20px 15px; padding: 15px; border-radius: 15px; 
        }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 5px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 25px; color: white; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-update { background: #10b981; }
        .btn-login { background: var(--primary); padding: 5px 15px; font-size: 11px; }

        /* Sidebar simple logic */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #1e293b; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid var(--primary); }
        .nav-item { color: #94a3b8; font-size: 18px; }
        .active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <h3 style="font-size: 14px; color: var(--primary);">PJKSS ডিজিটাল পোর্টাল</h3>
        <button id="login-btn" class="btn-login" onclick="handleAuth()">জিমেইল লগইন</button>
    </div>

    <!-- প্রোফাইল কার্ড (লগইন করার পর আপডেট হবে) -->
    <div class="profile-card">
        <img id="u-img" src="https://via.placeholder.com/60" alt="User">
        <div>
            <h2 id="u-name">সদস্যের নাম</h2>
            <p id="u-id">আইডি: PJKSS-000000</p>
            <p id="u-status" style="color: #4ade80;">● বর্তমানে সক্রিয়</p>
        </div>
    </div>

    <div class="container">
        <h5 class="section-title">আমাদের অনলাইন প্ল্যাটফর্ম</h5>
        <div class="grid-container">
            <div class="icon-card"><i class="fab fa-facebook" style="color:#1877f2;"></i><span>Facebook</span></div>
            <div class="icon-card"><i class="fab fa-youtube" style="color:#ff0000;"></i><span>YouTube</span></div>
            <div class="icon-card"><i class="fab fa-whatsapp" style="color:#25d366;"></i><span>WhatsApp</span></div>
            <div class="icon-card"><i class="fab fa-tiktok" style="color:#fff;"></i><span>TikTok</span></div>
        </div>

        <h5 class="section-title">আমাদের YouTube ভিডিও</h5>
        <div class="video-container">
            <div class="video-card">
                <div class="video-thumb"><i class="fab fa-youtube fa-2x"></i></div>
                <p>সমিতির কাজ ও সেবা</p>
            </div>
            <div class="video-card">
                <div class="video-thumb"><i class="fab fa-youtube fa-2x"></i></div>
                <p>নতুন সদস্য নিবন্ধন</p>
            </div>
        </div>

        <h5 class="section-title">সার্বিক পরিসংখ্যান</h5>
        <div class="stats-box">
            <div class="stat-line"><span>মোট সদস্য:</span> <b id="total-val">১২,৫৬৮</b></div>
            <div class="stat-line"><span>অনলাইন সদস্য:</span> <b id="online-val" style="color:#10b981;">১,২৫৬</b></div>
        </div>
    </div>

    <!-- এডমিন প্যানেল (লগইন করলে শুধু আপনার জন্য দেখা যাবে) -->
    <div id="admin-panel">
        <h5 style="color:var(--primary); text-align:center; margin-bottom:10px;">এডমিন প্যানেল</h5>
        <input type="number" id="inp-total" placeholder="মোট সদস্য সংখ্যা">
        <input type="number" id="inp-online" placeholder="অনলাইন সদস্য সংখ্যা">
        <button class="btn btn-update" onclick="saveData()">ডাটা আপডেট করুন</button>
    </div>

    <!-- নিচের নেভিগেশন বার -->
    <div class="nav-bar">
        <i class="fas fa-home nav-item active"></i>
        <i class="fas fa-users nav-item"></i>
        <i class="fas fa-bell nav-item"></i>
        <i class="fas fa-user-circle nav-item"></i>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <script>
        // Firebase Config (এখানে আপনার Firebase API Key বসাতে হবে)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_APP.firebaseapp.com",
            projectId: "YOUR_APP",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);

        function handleAuth() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).then((res) => {
                const user = res.user;
                document.getElementById('u-name').innerText = user.displayName;
                document.getElementById('u-img').src = user.photoURL;
                document.getElementById('u-id').innerText = "ID: " + user.uid.substring(0,8).toUpperCase();
                document.getElementById('login-btn').innerText = "লগআউট";

                // এডমিন চেক (এখানে আপনার নিজের Gmail দিন)
                if(user.email === "yourgmail@gmail.com") {
                    document.getElementById('admin-panel').style.display = 'block';
                }
            });
        }

        function saveData() {
            const t = document.getElementById('inp-total').value;
            const o = document.getElementById('inp-online').value;
            if(t) document.getElementById('total-val').innerText = t;
            if(o) document.getElementById('online-val').innerText = o;
            alert("তথ্য আপডেট হয়েছে!");
        }
    </script>
</body>
</html>
