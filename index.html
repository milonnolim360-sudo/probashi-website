<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন | এডমিন কন্ট্রোল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --gold: #ffd700; --gold-glow: 0 0 15px #ffd700; --bg: #000; --card: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background: var(--bg); color: white; padding-bottom: 50px; }

        /* Banner */
        .banner img { width: 100%; border-bottom: 3px solid var(--gold); }
        .container { padding: 15px; max-width: 800px; margin: auto; }

        /* Title Design */
        .title-gold { text-align: center; color: var(--gold); font-size: 18px; font-weight: bold; margin: 25px 0; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .title-gold::before, .title-gold::after { content: ""; width: 40px; height: 2px; background: var(--gold); }

        /* 16 Buttons Grid */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .card { background: var(--card); border: 1.5px solid var(--gold); border-radius: 12px; padding: 15px 5px; text-align: center; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; gap: 5px; box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.1); }
        .card i { font-size: 26px; color: var(--gold); }
        .card span { font-size: 10px; font-weight: bold; }

        /* Video Gallery */
        .v-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .v-box { background: #000; border: 1.5px solid var(--gold); border-radius: 10px; overflow: hidden; }
        .v-box iframe { width: 100%; height: 110px; border: none; }
        .v-box p { font-size: 10px; padding: 5px; text-align: center; color: var(--gold); }

        /* Contact Section */
        .wa-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .wa-btn { background: linear-gradient(135deg, #00a859, #004d2c); border: 1.5px solid var(--gold); border-radius: 40px; padding: 10px; text-align: center; text-decoration: none; color: white; font-size: 10px; font-weight: bold; display: flex; flex-direction: column; align-items: center; }

        /* Admin UI (The part you missed) */
        .admin-trigger { position: fixed; bottom: 20px; right: 20px; background: var(--gold); color: #000; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 1000; }
        
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 2000; padding: 20px; overflow-y: auto; }
        .admin-box { max-width: 450px; margin: auto; background: #111; padding: 20px; border: 2px solid var(--gold); border-radius: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid var(--gold); color: white; border-radius: 10px; }
        .btn-update { width: 100%; padding: 15px; background: var(--gold); border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: black; margin-top: 10px; }
        
        label { font-size: 12px; color: var(--gold); margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div class="banner">
        <img id="main-banner" src="https://i.ibb.co/XrnZzQk/Banner.jpg">
    </div>

    <div class="container">
        <div class="title-gold">FEATURES</div>
        <div class="grid" id="feature-grid-html">
            <!-- বাটনগুলো জাভাস্ক্রিপ্ট থেকে অটো লোড হবে -->
        </div>

        <div class="title-gold">VIDEO GALLERY</div>
        <div class="v-grid" id="video-grid-html">
            <!-- ভিডিও জাভাস্ক্রিপ্ট থেকে আসবে -->
        </div>

        <div class="title-gold">WHATSAPP CONTACT</div>
        <div class="wa-grid">
            <a id="wa-1" href="#" class="wa-btn"><i class="fab fa-whatsapp"></i><span>WhatsApp 1</span></a>
            <a id="wa-2" href="#" class="wa-btn"><i class="fab fa-whatsapp"></i><span>WhatsApp 2</span></a>
            <a id="wa-3" href="#" class="wa-btn"><i class="fab fa-whatsapp"></i><span>WhatsApp 3</span></a>
        </div>
    </div>

    <!-- এডমিন আইকন -->
    <div class="admin-trigger" onclick="toggleAdmin()"><i class="fas fa-user-shield"></i></div>

    <!-- এডমিন কন্ট্রোল প্যানেল -->
    <div id="admin-panel">
        <div class="admin-box" id="login-box">
            <h2 style="color:var(--gold); text-align:center; margin-bottom:20px;">অ্যাডমিন প্রবেশ</h2>
            <input type="text" id="user" placeholder="ইউজারনেম">
            <input type="password" id="pass" placeholder="পাসওয়ার্ড">
            <button class="btn-update" onclick="login()">লগইন</button>
            <button class="btn-update" style="background:#333; color:white;" onclick="toggleAdmin()">বন্ধ করুন</button>
        </div>

        <div class="admin-box" id="control-box" style="display:none;">
            <h2 style="color:var(--gold); text-align:center;">ম্যানেজমেন্ট প্যানেল</h2>
            
            <label>১. ব্যানার ইমেজের লিংক:</label>
            <input type="text" id="edit-banner" placeholder="URL Link">

            <label>২. ভিডিও ১ এর ইউটিউব ID:</label>
            <input type="text" id="v1" placeholder="dQw4w9WgXcQ">
            
            <label>৩. হোয়াটসঅ্যাপ ১ এর নম্বর:</label>
            <input type="text" id="num1" placeholder="+88019...">

            <button class="btn-update" onclick="saveChanges()">সব তথ্য সেভ করুন</button>
            <button class="btn-update" style="background:#444; color:white;" onclick="location.reload()">লগআউট</button>
        </div>
    </div>

    <script>
        // ডিফল্ট ডাটা
        let siteData = JSON.parse(localStorage.getItem('pjkss_data')) || {
            banner: "https://i.ibb.co/XrnZzQk/Banner.jpg",
            videos: ["dQw4w9WgXcQ", "ScMzIvxBSi4", "dQw4w9WgXcQ", "ScMzIvxBSi4"],
            wa: ["8801928807515", "601167672535", "8801961704927"],
            features: [
                {name: "FB Page", icon: "fab fa-facebook", link: "https://fb.com"},
                {name: "YouTube", icon: "fab fa-youtube", link: "https://youtube.com"},
                {name: "TikTok", icon: "fab fa-tiktok", link: "https://tiktok.com"},
                {name: "FB Group", icon: "fas fa-users", link: "#"}
                // এখানে ১৬টি আইকন ডাটা আছে
            ]
        };

        function loadSite() {
            document.getElementById('main-banner').src = siteData.banner;
            document.getElementById('wa-1').href = "https://wa.me/" + siteData.wa[0];
            document.getElementById('wa-2').href = "https://wa.me/" + siteData.wa[1];
            document.getElementById('wa-3').href = "https://wa.me/" + siteData.wa[2];

            // ভিডিও লোড
            let vHtml = "";
            siteData.videos.forEach(v => {
                vHtml += `<div class="v-box"><iframe src="https://www.youtube.com/embed/${v}"></iframe><p>ফাউন্ডেশন ভিডিও</p></div>`;
            });
            document.getElementById('video-grid-html').innerHTML = vHtml;

            // ফিচাস লোড (উদাহরণ হিসেবে ৪টি দেখানো হয়েছে)
            let fHtml = "";
            siteData.features.forEach(f => {
                fHtml += `<a href="${f.link}" class="card"><i class="${f.icon}"></i><span>${f.name}</span></a>`;
            });
            document.getElementById('feature-grid-html').innerHTML = fHtml;
        }

        function toggleAdmin() {
            const p = document.getElementById('admin-panel');
            p.style.display = (p.style.display === 'block') ? 'none' : 'block';
        }

        function login() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === "MDRAFIK1987" && p === "MDRAFIK@1987") {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('control-box').style.display = 'block';
                // ইনপুটে বর্তমান ডাটা বসানো
                document.getElementById('edit-banner').value = siteData.banner;
                document.getElementById('v1').value = siteData.videos[0];
                document.getElementById('num1').value = siteData.wa[0];
            } else { alert("ভুল তথ্য!"); }
        }

        function saveChanges() {
            siteData.banner = document.getElementById('edit-banner').value;
            siteData.videos[0] = document.getElementById('v1').value;
            siteData.wa[0] = document.getElementById('num1').value;
            
            localStorage.setItem('pjkss_data', JSON.stringify(siteData));
            alert("সব তথ্য ব্রাউজারে সেভ হয়েছে!");
            location.reload();
        }

        loadSite();
    </script>
</body>
</html>
