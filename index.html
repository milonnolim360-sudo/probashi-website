<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding-bottom: 100px; }
        .header { background: linear-gradient(to bottom, #d4af37, #000); padding: 20px; border-bottom: 2px solid #d4af37; }
        .gold-text { color: #d4af37; text-shadow: 0 0 10px #d4af37; font-weight: bold; }
        
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
        .card { background: #111; border: 1px solid #d4af37; border-radius: 15px; padding: 15px; box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); transition: 0.3s; }
        .card:hover { transform: scale(1.05); box-shadow: 0 0 20px #d4af37; }
        .card i { font-size: 30px; color: #d4af37; margin-bottom: 10px; }
        .card a { text-decoration: none; color: white; font-size: 10px; font-weight: bold; text-transform: uppercase; }

        .video-section { padding: 20px; }
        .video-box { background: #222; height: 150px; border: 1px solid #d4af37; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }

        .admin-btn { position: fixed; bottom: 20px; right: 20px; background: #d4af37; color: black; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; }
        
        /* Modal for Admin */
        #adminModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); padding:20px; box-sizing: border-box; overflow-y: scroll;}
        input { width: 90%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #d4af37; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <h2 class="gold-text">BANGLADESH PROBASHI MONCHO FOUNDATION</h2>
        <p style="font-size: 12px;">Location: Kalarapur, Malaysia | Estd: 01.01.2026</p>
    </div>

    <div class="grid-container" id="main-grid">
        <!-- বাটনগুলো এখানে অটোমেটিক আসবে -->
    </div>

    <h3 class="gold-text">VIDEO GALLERY</h3>
    <div class="video-section" id="video-grid">
        <div class="video-box">Video 1</div>
        <div class="video-box">Video 2</div>
    </div>

    <div class="admin-btn" onclick="openAdmin()">ADMIN PANEL</div>

    <!-- Admin Panel Logic -->
    <div id="adminModal">
        <h2 class="gold-text">ADMIN SETTINGS</h2>
        <p>পাসওয়ার্ড দিন (ডিফল্ট: 1234)</p>
        <input type="password" id="pass" placeholder="Password">
        <div id="editFields">
           <!-- এডিট করার ঘরগুলো এখানে আসবে -->
        </div>
        <button onclick="saveChanges()" style="background:#d4af37; padding:15px; width:100%;">SAVE ALL CHANGES</button>
        <button onclick="closeAdmin()" style="margin-top:10px;">CLOSE</button>
    </div>

    <script>
        let config = [
            { name: "Facebook Page", icon: "fab fa-facebook", url: "https://facebook.com" },
            { name: "WhatsApp Group", icon: "fab fa-whatsapp", url: "https://wa.me/123" },
            { name: "ESKL Register", icon: "fas fa-id-card", url: "https://example.com" },
            { name: "BKASH", icon: "fas fa-mobile-alt", url: "tel:*247#" }
        ];

        function render() {
            let html = "";
            config.forEach(item => {
                html += `<div class="card"><a href="${item.url}" target="_blank"><i class="${item.icon}"></i><br>${item.name}</a></div>`;
            });
            document.getElementById('main-grid').innerHTML = html;
        }

        function openAdmin() {
            let p = document.getElementById('pass').value;
            if(p === "1234") { // সিকিউরিটি পাসওয়ার্ড
                document.getElementById('adminModal').style.display = "block";
                let fields = "";
                config.forEach((item, index) => {
                    fields += `<h3>${item.name}</h3><input id="url-${index}" value="${item.url}" placeholder="Link URL">`;
                });
                document.getElementById('editFields').innerHTML = fields;
            } else {
                alert("ভুল পাসওয়ার্ড!");
                let ask = prompt("পাসওয়ার্ড দিন:");
                document.getElementById('pass').value = ask;
            }
        }

        function saveChanges() {
            config.forEach((item, index) => {
                item.url = document.getElementById(`url-${index}`).value;
            });
            render();
            alert("সেভ হয়েছে!");
            closeAdmin();
        }

        function closeAdmin() { document.getElementById('adminModal').style.display = "none"; }
        
        render();
    </script>
</body>
</html>
