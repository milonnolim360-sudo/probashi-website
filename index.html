    <style>
        /* --- গোল্ডেন প্রিমিয়াম থিম CSS --- */
        :root {
            --gold: linear-gradient(135deg, #ffd700, #b8860b);
            --gold-border: #ffd700;
            --bg-dark: #000000;
            --card-bg: rgba(20, 20, 20, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: white; padding-bottom: 50px; overflow-x: hidden; }

        /* টপ ব্যানার */
        .banner { width: 100%; border-bottom: 3px solid var(--gold-border); box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
        .banner img { width: 100%; display: block; }

        .container { padding: 15px; max-width: 800px; margin: auto; }

        /* টাইটেল ডিজাইন */
        .title-gold {
            text-align: center; color: #ffd700; font-size: 18px; font-weight: bold;
            margin: 25px 0; text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .title-gold::before, .title-gold::after { content: ""; width: 50px; height: 2px; background: var(--gold); }

        /* ফিচাস গ্রিড (১৬ বাটন) */
        .features-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .feature-card {
            background: var(--card-bg); border: 1.5px solid var(--gold-border);
            border-radius: 12px; padding: 15px 5px; text-align: center;
            text-decoration: none; color: white; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.1);
        }
        .feature-card:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        .feature-card i { font-size: 26px; color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .feature-card h4 { font-size: 10px; font-weight: bold; text-transform: uppercase; color: #fff; }
        .feature-card p { font-size: 8px; color: #ffd700; opacity: 0.8; }

        /* ভিডিও গ্যালারি */
        .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .video-item { 
            background: #111; border-radius: 10px; border: 1.5px solid var(--gold-border);
            overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .video-item iframe { width: 100%; height: 110px; border: none; }
        .video-item p { font-size: 10px; padding: 8px; text-align: center; color: #ffd700; background: rgba(0,0,0,0.8); }

        /* হোয়াটসঅ্যাপ কন্টাক্ট সেকশন */
        .wa-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 25px; }
        .wa-btn {
            background: linear-gradient(135deg, #00a859, #004d2c);
            border: 1.5px solid #ffd700; border-radius: 40px; padding: 10px;
            text-align: center; text-decoration: none; color: white;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            box-shadow: 0 5px 15px rgba(0, 168, 89, 0.3);
        }
        .wa-btn i { font-size: 18px; }
        .wa-btn span { font-size: 10px; font-weight: bold; }
        .wa-btn small { font-size: 8px; opacity: 0.9; }

        /* ফুটার */
        .footer { text-align: center; margin-top: 40px; padding: 20px; border-top: 1px solid #333; }
        .footer p { color: #ffd700; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
